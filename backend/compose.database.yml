# Entorno local de pruebas. No despliega ni se conecta al proyecto alojado.
name: fondea-t04-test
services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.006
    container_name: fondea-db-test
    environment:
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
      JWT_SECRET: fondea-local-test-only-signing-key-32chars
      JWT_EXP: '3600'
    volumes:
      - fondea_db_test:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      GOTRUE_JWT_SECRET: fondea-local-test-only-signing-key-32chars
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:9999/health]
      interval: 2s
      timeout: 5s
      retries: 30
  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: fondea-local-test-only-signing-key-32chars
  storage:
    image: public.ecr.aws/supabase/storage-api:v1.84.19
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://supabase_storage_admin:postgres@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: fondea-local-test-only-signing-key-32chars
      ANON_KEY: fondea-local-anon
      SERVICE_KEY: fondea-local-service
      TENANT_ID: fondea-local
      REGION: local
      GLOBAL_S3_BUCKET: local
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  fondea_db_test:
